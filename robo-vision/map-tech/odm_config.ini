# OpenDroneMap 設定ファイル
# このファイルをプロジェクトの設定に合わせて編集してください

[paths]
# 基本パス設定
odm_executable = odm
images_folder = C:\path\to\drone\images
output_folder = C:\path\to\output\project
temp_folder = C:\path\to\temp

[processing]
# 処理品質設定
feature_quality = high          # low, medium, high, ultra
pc_quality = high              # low, medium, high, ultra
mesh_size = 200000             # メッシュの最大面数
mesh_octree_depth = 9          # オクトリー深度 (8-12推奨)

[output]
# 出力設定
orthophoto_resolution = 2      # オルソフォト解像度 (cm/pixel)
dem_resolution = 2             # DEM解像度 (cm/pixel)
texture_size = 4096           # テクスチャサイズ
use_3d_mesh = true            # 3Dメッシュ生成
use_orthophoto = true         # オルソフォト生成
use_dem = true                # DEM生成

[advanced]
# 高度な設定
use_hybrid_bundle_adjustment = true
matcher_neighbors = 8
matcher_distance = 0.7
optimize_disk_space = false
rerun_from = ""               # 途中から再実行 (odm_meshing, odm_texturing等)

[webodm]
# WebODM API設定
base_url = http://localhost:8000
username = admin
password = admin
auto_delete_task = false

[docker]
# Docker設定
use_docker = true
docker_image = opendronemap/odm
docker_gpu = false            # GPU使用 (NVIDIA Docker必要)
